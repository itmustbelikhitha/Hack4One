services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dayflow
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: .env.example
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      VITE_API_URL: http://localhost:4200/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  postgres-data:
